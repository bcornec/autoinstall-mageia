# Used by both install and check
#
- name: Generate mga-check-srv
  become: true
  become_user: root
  ansible.builtin.template:
    src: "{{ MGAANSIBLEDIR }}/templates/bin/mga-check-srv.j2"
    dest: "{{ MGALOCAL }}/bin/mga-check-srv"
    owner: "{{ MGAUSER }}"
    group: "{{ MGAUSER }}"
    mode: '0755'
