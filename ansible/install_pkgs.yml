- name: Ensure that common packages are installed for repo setup
  become: true
  become_user: root
  ansible.builtin.package:
    name:
      - curl
      - gnupg2
    state: present
    update_cache: true

- name: Ensure all required packages are installed and urpmi db updated
  become: true
  become_user: root
  ansible.builtin.package:
    name: >-
      {{ nodes
         | selectattr('role', 'in', ['system', MGATYPE])
         | map(attribute='pkgs', default=[])
         | flatten
         | unique
         | list }}
    update_cache: true
    state: present
  #loop: "{{ nodes | subelements('pkgs', skip_missing=true)}}"
  #when: item.0.role == "system" or item.0.role == MGATYPE

