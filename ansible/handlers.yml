- name: reload httpd
  become: true
  become_user: root
  ansible.builtin.service: name=httpd state=reloaded

- name: restart httpd
  become: true
  become_user: root
  ansible.builtin.service: name=httpd state=restarted

- name: restart shorewall
  become: true
  become_user: root
  ansible.builtin.service: name=shorewall state=restarted

- name: restart sshd
  become: true
  become_user: root
  ansible.builtin.service: name=sshd state=restarted

- name: restart dhcpd
  become: true
  become_user: root
  ansible.builtin.service: name=dhcpd state=restarted

- name: restart sshutout
  become: true
  become_user: root
  ansible.builtin.service: name=sshutout state=restarted

- name: restart fail2ban
  become: true
  become_user: root
  ansible.builtin.service: name=fail2ban state=restarted

- name: restart xymon-client
  become: true
  become_user: root
  ansible.builtin.service: name=xymon-client state=restarted
