---
- name: Playbook for Mageia Infra server installation
  hosts: all
  gather_facts: true

  tasks:
    - name: Include variables for the underlying distribution
      ansible.builtin.include_vars: "{{ MGAANSIBLEDIR }}/group_vars/{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"

    - name: Base setup for a Mageia Infra server
      ansible.builtin.import_tasks: "{{ MGAANSIBLEDIR }}/install_system.yml"
