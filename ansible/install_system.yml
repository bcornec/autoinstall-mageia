---
- name: Load variables generated at install time
  ansible.builtin.include_vars: "{{ MGALOCAL }}/etc/mageia.yml"

- name: Check for installed packages
  ansible.builtin.import_tasks: "{{ MGAANSIBLEDIR }}/install_pkgs.yml"

- name: Setup ansible configuration
  ansible.builtin.copy:
    src: "{{ MGAREPODIR }}/.ansible.cfg"
    dest: "{{ ansible_facts['env']['HOME'] }}/.ansible.cfg"
    mode: "0644"

- name: Install XML file for hponcfg
  become: true
  become_user: root
  ansible.builtin.copy:
    src: "{{ MGAANSIBLEDIR }}/templates/local/get-ilo-asset-tag.xml"
    dest: "{{ MGALOCAL }}/etc/get-ilo-asset-tag.xml"

- name: Install script to get asset tag
  become: true
  become_user: root
  ansible.builtin.template:
    src: "{{ MGAANSIBLEDIR }}/templates/bin/get-ilo-asset-tag.sh"
    dest: "{{ MGALOCAL }}/bin/get-ilo-asset-tag.sh"
    owner: "{{ MGAUSER }}"
    group: "{{ MGAUSER }}"
    mode: '0700'

- name: Vaultfile creation
  become: true
  become_user: root
  ansible.builtin.command:
    cmd: "{{ MGALOCAL }}/bin/get-ilo-asset-tag.sh > {{ MGAHDIR }}/.mgavaultfile"
  no_log: true

- name: Protect vaultfile
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ MGAHDIR }}/.mgavaultfile"
    owner: "{{ MGAUSER }}"
    group: "{{ MGAUSER }}"
    mode: '0600'

- name: Disable autoinstall
  become: true
  become_user: root
  ansible.builtin.systemd:
    daemon_reload: true
    enabled: false
    name: autoinstall-mageia
  ignore_errors: true
